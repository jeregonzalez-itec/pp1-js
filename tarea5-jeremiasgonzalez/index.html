<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp simple</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white dark:bg-gray-900 ">
      <div class="w-full flex flex-col justify-center items-center h-screen">
    <h1 class="text-4xl font-bold mb-2 text-white">To-Do List</h1>
    <button class="rounded-xl p-2 my-10 bg-zinc-800 text-white"  id="toggleMode">cambiar modo</button>
    <div class="flex gap-2 mb-2 w-75">
      <input type="text"
       id="inputTask" 
       class="flex p-2 rounded
        bg-zinc-800 text-white w-full" placeholder="Presiona Enter para agregar la tarea">
    </div>

    <ul id="taskList">

    </ul>
   
  </div>
    <script src="main.js"></script>
</body>
</html>
